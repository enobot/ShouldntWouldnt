<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Store small promo tile</title>
    <style>
      /* 440×280, the Chrome Web Store small promo tile. */
      html,
      body {
        margin: 0;
        width: 440px;
        height: 280px;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 14px;
        padding: 0 34px;
        box-sizing: border-box;
        background: #7a2430;
        color: #fff7f7;
        font-family: "Segoe UI", system-ui, sans-serif;
      }

      .name {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 0;
        font-size: 31px;
        font-weight: 650;
        letter-spacing: -0.01em;
      }

      .name img {
        width: 52px;
        height: 52px;
        border-radius: 12px;
        box-shadow: 0 0 0 2px #fff7f7;
      }

      .tagline {
        margin: 0;
        font: italic 21px/1.3 Georgia, "Times New Roman", serif;
      }

      .note {
        margin: 4px 0 0;
        padding: 8px 10px;
        border: 1px solid #f3c4cc;
        border-radius: 6px;
        background: #fff7f7;
        color: #3f1d24;
        font: 13px/1.4 Georgia, "Times New Roman", serif;
      }
    </style>
  </head>
  <body>
    <p class="name"><img src="/icons/icon128.png" alt="" /> Shouldn't Wouldn't</p>
    <p class="tagline">Think Twice Before You Share.</p>
    <p class="note">Free, local reminders when a page asks for sensitive information.</p>
  </body>
</html>
