<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Several fields</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Several fields</h1>
    <form action="#multiple" method="get">
      <label>Email <input type="email" name="email" autocomplete="email" /></label>
      <label>Phone <input type="tel" name="phone" autocomplete="tel" /></label>
      <label>Street address <input name="street" autocomplete="street-address" /></label>
      <label>Date of birth <input name="dob" autocomplete="bday" /></label>
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
