<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Other languages</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Forms in other languages</h1>
    <p class="note">
      Fake labels only. The sensitive fields should get notes in the language chosen for the extension; the comments box
      and the sign-in code should stay quiet. The page itself is not translated.
    </p>
    <form action="#saved" method="get">
      <label lang="es">Número de Seguro Social <input id="es-ssn" name="ssn_es" /></label>
      <label lang="es">Comentarios <textarea id="es-comments" name="comentarios"></textarea></label>
      <label lang="zh-CN">银行卡号 <input id="zh-card" name="kahao" /></label>
      <label lang="zh-CN">短信验证码 <input id="zh-otp" name="yzm" /></label>
      <label lang="ko">카드번호 <input id="ko-card" name="kadeu" /></label>
      <label lang="vi">Số tài khoản <input id="vi-bank" name="taikhoan" /></label>
      <label lang="ru">Девичья фамилия матери <input id="ru-maiden" name="familiya" /></label>
      <label lang="ar" dir="rtl">تاريخ الميلاد <input id="ar-dob" name="milad" /></label>
      <button type="submit">Enviar</button>
    </form>
  </body>
</html>
