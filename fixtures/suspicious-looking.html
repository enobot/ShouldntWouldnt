<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Suspicious-looking hostname</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Suspicious-looking hostname</h1>
    <p class="note">
      The lookalike signal reads the page hostname. Opening this file as 127.0.0.1 does not look like another brand.
      A hostname such as paypal-login.example does.
    </p>
    <form action="#look" method="get">
      <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
