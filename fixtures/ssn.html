<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Benefits form</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Benefits</h1>
    <p class="note">The Social Security field should get a reminder. The comments box should stay quiet.</p>
    <form action="#benefits" method="get">
      <label>Social Security number <input id="ssn" name="ssn" autocomplete="off" /></label>
      <label>Comments <textarea name="comments"></textarea></label>
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
