<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Page with a frame</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Page with a frame</h1>
    <p class="note">The page has one password field. The frame below has two more sensitive fields. The popup describes the page itself.</p>
    <form action="#top" method="get">
      <label>Password <input type="password" name="password" autocomplete="current-password" /></label>
    </form>
    <iframe src="frame-child.html" title="Embedded form" style="width: 100%; height: 260px; border: 1px solid #ccc"></iframe>
  </body>
</html>
