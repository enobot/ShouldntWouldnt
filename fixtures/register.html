<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Registration form</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Create an account</h1>
    <p class="note">Fake registration. Email, password, and phone should get reminders. The name should stay quiet.</p>
    <form action="#register" method="get">
      <label>Full name <input name="full_name" autocomplete="name" /></label>
      <label>Email <input type="email" name="email" autocomplete="email" /></label>
      <label>Mobile phone <input type="tel" name="phone" autocomplete="tel" /></label>
      <label>Create a password <input type="password" name="password" autocomplete="new-password" /></label>
      <button type="submit">Create account</button>
    </form>
  </body>
</html>
