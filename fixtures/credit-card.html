<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Card</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Card</h1>
    <form action="#card" method="get">
      <label>Name on card <input autocomplete="cc-name" name="ccname" /></label>
      <label>Card number <input autocomplete="cc-number" name="cardnumber" /></label>
      <label>Expiration <input autocomplete="cc-exp" name="exp" /></label>
      <label>Security code <input name="cvv" autocomplete="cc-csc" /></label>
      <button type="submit">Pay</button>
    </form>
  </body>
</html>
