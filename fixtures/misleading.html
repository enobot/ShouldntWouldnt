<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Misleading labels</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>Misleading labels</h1>
    <p class="note">Social alone and a mother's maiden name stay quiet. Account number warns as a bank account. A license key stays quiet.</p>
    <form action="#labels" method="get">
      <label>Social <input name="social" /></label>
      <label>Mother's maiden name <input name="maiden" /></label>
      <label>Account number <input name="account" /></label>
      <label>License key <input name="license" /></label>
      <button type="submit">Continue</button>
    </form>
  </body>
</html>
