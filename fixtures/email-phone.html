<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Email and phone</title>
    <link rel="stylesheet" href="common.css" />
  </head>
  <body>
    <h1>How can we reach you?</h1>
    <p class="note">These should get the milder reminder, not the stronger sensitive-information wording.</p>
    <form action="#contact-details" method="get">
      <label>Email address <input type="email" name="email" autocomplete="email" /></label>
      <label>Phone number <input type="tel" name="phone" autocomplete="tel" /></label>
      <button type="submit">Save</button>
    </form>
  </body>
</html>
